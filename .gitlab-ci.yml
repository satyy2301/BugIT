stages:
  - lint
  - build
  - test
  - docker
  - integration

variables:
  GO_VERSION: "1.22"
  DRE_SNAPSHOT_KEY: "ci-test-key"

lint:
  stage: lint
  image: golang:${GO_VERSION}
  script:
    - go vet ./...
    - |
      if command -v golangci-lint; then
        golangci-lint run ./...
      else
        echo "golangci-lint not installed, skipping"
      fi

build:
  stage: build
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - apt-get update && apt-get install -y clang llvm libbpf-dev linux-headers-amd64
    - go install github.com/cilium/ebpf/cmd/bpf2go@v0.16.0
  script:
    - make build-linux
  artifacts:
    paths:
      - bin/

test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go test ./...
    - go test -v ./dre-replay-cli/...

test:vscode:
  stage: test
  image: node:20-bookworm
  script:
    - cd extensions/vscode && npm ci && npm run compile && node out/collector.test.js

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t bugit/dre-agent:dev -f dre-agent/Dockerfile .
    - docker build -t bugit/dre-collector:dev -f dre-collector/Dockerfile .
  rules:
    - if: $CI_COMMIT_BRANCH

integration:
  stage: integration
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - apt-get update && apt-get install -y netcat-openbsd
  script:
    - go test -v ./test/integration/...
    - go test -v ./pkg/drearchive/...
    - go test -v ./dre-collector/internal/server/...
    - go build -o bin/dre-replay ./dre-replay-cli/cmd/dre-replay
    - bash test/integration/replay_e2e.sh
  rules:
    - when: manual

jetbrains:compile:
  stage: integration
  image: gradle:8.5-jdk17
  script:
    - cd extensions/jetbrains && gradle buildPlugin --no-daemon
  rules:
    - when: manual

integration:kind:
  stage: integration
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - apt-get update && apt-get install -y clang llvm libbpf-dev linux-headers-amd64 docker.io
    - curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 && chmod +x ./kind
    - go install github.com/cilium/ebpf/cmd/bpf2go@v0.16.0
  script:
    - make build-linux docker
    - ./kind create cluster --name dre-engine || true
    - make kind-load deploy-kind
    - bash test/integration/kind_capture_test.sh
    - bash test/perf/agent_load.sh
  rules:
    - when: manual
