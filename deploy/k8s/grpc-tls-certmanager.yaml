# Example cert-manager Certificate for agent→collector mTLS.
# Requires cert-manager installed and a ClusterIssuer (e.g. self-signed or CA).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dre-grpc-tls
  namespace: dre-engine
spec:
  secretName: dre-grpc-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: dre-internal-ca
    kind: ClusterIssuer
  dnsNames:
    - dre-collector
    - dre-collector.dre-engine.svc
    - dre-collector.dre-engine.svc.cluster.local
  usages:
    - server auth
    - client auth
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: dre-internal-ca
spec:
  selfSigned: {}
