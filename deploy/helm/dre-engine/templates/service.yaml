apiVersion: v1
kind: Service
metadata:
  name: dre-collector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: dre-collector
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: metrics
      port: 8081
      targetPort: metrics
