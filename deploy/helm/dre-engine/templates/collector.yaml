apiVersion: apps/v1
kind: Deployment
metadata:
  name: dre-collector
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app: dre-collector
  template:
    metadata:
      labels:
        app: dre-collector
    spec:
      serviceAccountName: dre-collector
      containers:
        - name: dre-collector
          image: {{ .Values.collector.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          env:
            - name: DRE_DATA_DIR
              value: /var/lib/dre
            - name: DRE_CLUSTER
              value: {{ .Values.collector.cluster | quote }}
            - name: DRE_SNAPSHOT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.snapshot.encryptionSecret }}
                  key: key
            - name: DRE_METRICS_ADDR
              value: ":8081"
            - name: DRE_TRIGGER_RULES_PATH
              value: /etc/dre/trigger_rules.yaml
            {{- if .Values.collector.leaderElect }}
            - name: DRE_LEADER_ELECT
              value: "1"
            - name: DRE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- if .Values.s3.bucket }}
            - name: DRE_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: DRE_S3_PREFIX
              value: {{ .Values.s3.prefix | quote }}
            - name: DRE_S3_REGION
              value: {{ .Values.s3.region | quote }}
            {{- if .Values.s3.endpoint }}
            - name: DRE_S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: DRE_S3_FORCE_PATH_STYLE
              value: "1"
            {{- end }}
            {{- end }}
            {{- if .Values.gcs.bucket }}
            - name: DRE_GCS_BUCKET
              value: {{ .Values.gcs.bucket | quote }}
            - name: DRE_GCS_PREFIX
              value: {{ .Values.gcs.prefix | quote }}
            {{- end }}
            {{- if .Values.grpc.tls.enabled }}
            - name: DRE_GRPC_TLS_CERT_FILE
              value: /etc/dre/tls/tls.crt
            - name: DRE_GRPC_TLS_KEY_FILE
              value: /etc/dre/tls/tls.key
            {{- end }}
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/dre
            - name: config
              mountPath: /etc/dre
            {{- if .Values.grpc.tls.enabled }}
            - name: grpc-tls
              mountPath: /etc/dre/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.pvc.enabled }}
          persistentVolumeClaim:
            claimName: dre-collector-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: dre-collector-config
        {{- if .Values.grpc.tls.enabled }}
        - name: grpc-tls
          secret:
            secretName: {{ .Values.grpc.tls.secretName }}
        {{- end }}
